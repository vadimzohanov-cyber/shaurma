</style>
</head>

const P = ()=>PLACES[S.place]||PLACES.stop;
const G = ()=>GRILLS[S.grill]||GRILLS.used;
function quality(){ let sp=0,q=0; S.staff.forEach(w=>{sp+=w.speed;q+=w.q*w.speed}); let v=(q/sp)*G().q; if(S.supplier) v-=.15; if(S.up.sauce) v+=.08; return v; }
function capacity(){ const staff=S.staff.filter(w=>w.id!==S.absent).reduce((a,w)=>a+w.speed,0); const grill=G().cap+(S.up.grill2?45:0); return Math.min(staff,grill); }
function wages(){ return S.staff.reduce((a,w)=>a+w.wage,0); }
function effMult(type){ return S.effects.filter(e=>e.type===type && e.until>=S.day).reduce((a,e)=>a*e.mult,1); }
function monthIdx(d){ return Math.min(MONTHS.length-1, Math.floor((d-1)/30)); }
function seasonK(d){ return [1,1,.92,.88,.86,.9,1][monthIdx(d)]; }
function priceK(){ const r=S.price/refOf(S.place); let k=Math.exp(-2.1*(r-1)); if(S.competitor && S.price>230) k*=.88; return Math.max(.08,Math.min(2.2,k)); }
function avgCheck(){ return S.price*(S.up.drinks?1.15:1)*effMult("check"); }
function unitCost(){ let c=((S.supplier?75:110)+(S.up.drinks?10:0))*effMult("cost"); if(SEASON().crisis) c*=1+.08*monthIdx(Math.max(1,S.day)); return c; }
function stars(){ return Math.max(1,Math.min(5,(S.rep*3.6))).toFixed(1); }
function dayTraffic(day){
  const wd=(day-1)%7, P0=P();
  let k = DIFF[S.diff].traffic * WDK[wd] * seasonK(day) * effMult("traffic");
  if(S.place==="market" && wd>=5) k*=1.15;
  if(S.up.sign) k*=1.1; if(S.franchise) k*=1.3; if(S.competitor) k*=.85; if(SEASON().crisis) k*=.85;
  const w = {sun:1,cloud:.95,rain:.72,snow:.8}[S.weather]||1;
  return P0.traffic*cityOf(S.city).t*winterK(S.city,day)*k*w;
}
function buyP(){ let p=.06*priceK()*Math.max(.5,S.rep)*Math.max(.6,quality()); if(S.up.card)p*=1.08; return p; }
function rollWeather(day){ const m=monthIdx(day); const r=Math.random(); if(m>=3&&m<=5) return r<.25?"snow":r<.55?"cloud":"sun"; return r<.18?"rain":r<.45?"cloud":"sun"; }

function drawWalker(w){
  const ink="#2A1C12", s=w.s, x=w.x, y=w.y; cx.save(); cx.translate(x,y); cx.scale(s,s); cx.lineWidth=3; cx.strokeStyle=ink;

  else { cx.fillStyle="#1d1d1d"; rr(w.dir*13-4,-56,8,13,2); cx.fill(); }

const QX = i => 192 + i*34;
let lastOut=0, spawnAcc=0;
function stepWalkers(dt, gameRate){
  spinA += dt*1.5; lastOut += dt;
  spawnAcc += dt*(running?0.55:0.25);
  if(spawnAcc>1){ spawnAcc=0; if(walkers.filter(w=>w.st==="walk").length<6) walkers.push(newWalker(false)); }
  if(sim && sim.queue) sim.queue.forEach((q,i)=>{ const tx=QX(i); if(q.x===undefined) q.x=tx+70; q.x += (tx-q.x)*Math.min(1,dt*6); q.ph+=dt*8; });
  walkers.forEach(w=>{
    const v = w.sp*dt*Math.min(3,Math.max(1,gameRate));
    if(w.st==="walk"){ w.x+=w.dir*v; w.ph+=dt*8; }
    else if(w.st==="in"){ const tx=QX(w.slot); const d=tx-w.x; if(Math.abs(d)<3){ w.st="queue"; w.x=tx; w.y=296; } else { w.dir=Math.sign(d); w.x+=w.dir*Math.min(Math.abs(d),v*1.3); w.ph+=dt*8; w.y+= (296-w.y)*.1; } }
    else if(w.st==="queue"){ const tx=QX(w.slot); if(Math.abs(tx-w.x)>2){ w.x+=Math.sign(tx-w.x)*Math.min(Math.abs(tx-w.x),v); w.ph+=dt*8; } }
    else if(w.st==="out"){ w.x+=w.dir*v*1.1; w.ph+=dt*8; w.y+=(306-w.y)*.05; }
  });
  walkers = walkers.filter(w=>w.x>-60 && w.x<W+60);
  floats.forEach(f=>{f.y-=dt*30; f.a-=dt*.9}); floats=floats.filter(f=>f.a>0);
  confetti.forEach(c=>{ c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=260*dt; c.r+=c.vr*dt; }); confetti=confetti.filter(c=>c.y<H+20);
}

/* ===================== СИМУЛЯЦИЯ ДНЯ ===================== */
function startDay(){
  if(running || S.over) return;
  if(S.setup){ intro(); return; }
  S.day++;
  S.weather = rollWeather(S.day);
  const traffic = dayTraffic(S.day);
  sim = {min:420, end:1320, traffic, p:buyP(), cap:capacity(), maxQ:8+(S.up.tables?4:0), queue:[], prog:0,
         sold:0, lost:0, rev:0, ing:0, acc:0};
  S.openFrom = S.grillBroken ? 14 : (S.lateOpen||7);
  running = true; walkers = walkers.filter(w=>w.st==="walk"); floats=[];
  renderShop(); lastT = performance.now(); requestAnimationFrame(loop);
}
let lastT=0;
function loop(t){
  if(!running) return;
  const dt = Math.min(.1,(t-lastT)/1000); lastT=t;
  const rate = 30*S.speed; // игровых минут в секунду
  sim.acc += dt*rate;
  while(sim.acc>=1 && sim.min<sim.end){ sim.acc-=1; simMinute(); }
  stepWalkers(dt, S.speed);
  draw(sim.min); hud();
  if(sim.min>=sim.end && sim.queue.length===0){ endDay(); return; }
  if(sim.min>=sim.end){ // дообслуживаем очередь после закрытия
    sim.prog += sim.cap/60; while(sim.prog>=1 && sim.queue.length){ sim.prog-=1; serve(); }
  }
  requestAnimationFrame(loop);
}
function simMinute(){
  const h = Math.floor(sim.min/60), open = h>=S.openFrom;
  const c = CURVE[Math.min(14,Math.max(0,h-7))]/CSUM;
  const lam = sim.traffic/900*c;
  if(open){
    const buyers = poisson(lam*sim.p);
    for(let i=0;i<buyers;i++){
      if(sim.queue.length < sim.maxQ){ const w=newWalker(true); w.st="queue"; w.y=296; w.x=undefined; sim.queue.push(w); }
      else sim.lost++;
    }
    sim.prog += sim.cap/60;
    while(sim.prog>=1 && sim.queue.length){ sim.prog-=1; serve(); }
    if(!sim.queue.length) sim.prog=Math.min(sim.prog,1);
  }
  sim.min++;
}
function serve(){
  const w = sim.queue.shift();
  if(w && lastOut>0.3){ lastOut=0; w.st="out"; w.carry=true; w.dir=1; if(w.x===undefined) w.x=QX(0); walkers.push(w); if(floats.length<4) floats.push({t:"+"+Math.round(avgCheck()),x:w.x-10,y:w.y-100,a:1.2}); }
  sim.sold++; sim.rev += avgCheck(); sim.ing += unitCost();
  if(S.day===1 && sim.sold===1){ burst(QX(0),200,70); toast("🎉 Первый покупатель! Касса открыта!"); }
}
function hud(){
  const m=Math.min(sim?sim.min:420,1320); const hh=String(Math.floor(m/60)).padStart(2,"0"), mm=String(m%60).padStart(2,"0");
  if($("hTime")) $("hTime").textContent = hh+":"+mm;
  if($("hSold")) $("hSold").textContent = (sim?sim.sold:0)+" шт.";
  if($("hRev")) $("hRev").textContent = "+"+fmt(sim?sim.rev:0).replace(" ₽","")+" ₽";
  if($("wth")) $("wth").textContent = WEATHER[S.weather]||"";
}
function endDay(){
  running=false;
  const P0=P(), r={day:S.day, sold:sim.sold, lost:sim.lost, rev:sim.rev, ing:sim.ing};
  let deliv=0;
  if(S.up.delivery){ const n=Math.round(sim.sold*.2*rnd(.8,1.2)); deliv=n*avgCheck()*.75; r.sold+=n; r.ing+=n*unitCost(); r.deliv=n; }
  r.rev += deliv;
  r.rent = rentOf(S.place)/30;
  r.wage = wages();
  r.util = 1500;
  r.tax = r.rev*.06;
  r.extra = 0; r.extraTxt=[];
  if(S.place==="market"){ r.extra+=3000; r.extraTxt.push("уборка"); }
  if(S.place==="mall"){ r.extra+=r.rev*.08; r.extraTxt.push("8% ТЦ"); }
  if(S.franchise){ r.extra+=r.rev*.12; r.extraTxt.push("роялти 12%"); }
  if(S.insured){ r.extra+=900; r.extraTxt.push("страховка"); }
  if(S.grillBroken){ r.extra+=S.repairCost||0; r.extraTxt.push("ремонт"); S.grillBroken=false; S.repairCost=0; }
  r.interest = 0;
  if(S.debt>0){ r.interest = S.debt*.015; S.debt += r.interest; }
  r.exp = r.ing + r.rent + r.wage + r.util + r.tax + r.extra;
  r.net = r.rev - r.exp;
  S.money += r.net; S.totalSold += r.sold;
  r.bonus=0; r.tasksOk=[];
  (S.tasks||[]).forEach(t=>{ if(taskDone(t,r)){ t.done=true; r.bonus+=t.reward; r.tasksOk.push(TASK_TXT[t.type](t)); M.tasksDone++; } });
  S.money += r.bonus; saveM();
  r.brNet=0; r.brSold=0;

  S.absent=null; S.lateOpen=null;

  S.hist.push({d:S.day,m:Math.round(S.money),rev:Math.round(r.rev),exp:Math.round(r.exp),sold:r.sold});
  if(S.hist.length>200) S.hist.shift();
  S.last = r;
  S.effects = S.effects.filter(e=>e.until>S.day);
  if(S.day%7===0) S.cands=[];
  if(S.money<0){ S.negDays++; } else S.negDays=0;
  save(); render();
  if(S.negDays>=3){ bankrupt(); return; }
  if(S.money<0) toast("Касса в минусе! Ещё "+(3-S.negDays)+" дн. — и банкротство",true);
  if(r.tasksOk.length) toast("✅ Задание выполнено! +"+fmt(r.bonus));
  checkAch();
  if(seasonWinNow()){ victory(); return; }
  if(S.day>=D()){ if(seasonWinEnd()) victory(); else seasonFail(); return; }
  genTasks();
  const evs = buildEvents(S.day+1);
  if(evs.length){ runEvents(evs, ()=>afterEvents()); } else afterEvents();
}

const TASK_TXT={
  sell:t=>`Продай ${t.n} шаурм за день`,
  net:t=>`Заработай за день ${fmt(t.n)} чистыми`,
  noloss:t=>`Продай ${t.n}+ шаурм и не потеряй ни одного покупателя`,
  rev:t=>`Набери выручку ${fmt(t.n)} за день`,
  premium:t=>`Продай ${t.n} шаурм по цене от ${premPrice()} ₽`
};
function premPrice(){ return Math.round(refOf(S.place)*1.15/10)*10; }
function taskDone(t,r){ switch(t.type){ case "sell": return r.sold>=t.n; case "net": return r.net>=t.n; case "noloss": return r.sold>=t.n && r.lost===0; case "rev": return r.rev>=t.n; case "premium": return r.sold>=t.n && S.price>=premPrice(); } return false; }
function genTasks(){
  const L=S.last, base=L?L.sold:Math.max(40,Math.round(dayTraffic(S.day+1)*buyP()*.9));
  const pool=[
    {type:"sell", n:Math.max(40,Math.round(base*1.12/10)*10), reward:15000},
    {type:"net", n:Math.max(8000,Math.round(Math.max(L?L.net:12000,8000)*1.2/1000)*1000), reward:20000},
    {type:"rev", n:Math.max(15000,Math.round((L?L.rev:base*S.price)*1.15/1000)*1000), reward:15000}
  ];
  if(base>=40) pool.push({type:"noloss", n:Math.min(Math.round(base/10)*10,150), reward:15000});
  if(S.day>=3) pool.push({type:"premium", n:Math.max(30,Math.round(base*.7/10)*10), reward:25000});
  pool.sort(()=>Math.random()-.5); S.tasks=pool.slice(0,2).map(t=>({...t,done:false}));
}

/* ===================== СЕТЬ ТОЧЕК ===================== */
function brOpenCost(c,t){ return Math.round(cityOf(c).open*({market:.85,stop:1,mall:1.3}[t])/10000)*10000; }
function brUpCost(b){ return Math.round((b.level===1?250000:500000)*Math.sqrt(cityOf(b.city).r)/10000)*10000; }
function brPrice(b){ return Math.round(refOf(b.type,b.city)*POL[b.policy].k/10)*10; }
function branchDay(b){
  const pl=PLACES[b.type], c=cityOf(b.city), wd=(S.day-1)%7, L=LV[b.level];
  const ref=refOf(b.type,b.city), price=brPrice(b);
  let traffic=pl.traffic*c.t*WDK[wd]*seasonK(S.day)*winterK(b.city,S.day)*rnd(.8,1.15);
  if(SEASON().crisis) traffic*=.85;
  const pk=Math.max(.1,Math.exp(-2.1*(price/ref-1)));
  const demand=traffic*.045*pk*b.rep*L.q*(S.franchise?1.15:1);
  const cap=L.cap*15, sold=Math.round(Math.min(demand,cap)), lost=Math.max(0,Math.round(demand-cap));
  const rev=sold*price, cost=sold*unitCost()+rentOf(b.type,b.city)/30+L.wage+rev*.06+1200+(S.franchise?rev*.12:0);
  b.rep=Math.max(.6,Math.min(1.35,b.rep+.02*(L.q-1)-.05*(lost/Math.max(1,sold+lost))+(b.policy==="low"?.004:b.policy==="high"?-.004:0)));
  return {sold,lost,rev:Math.round(rev),net:Math.round(rev-cost),price};
}

function applyOut(o){ const L=[];
  if(o.money){ S.money+=o.money; L.push([(o.money>0?"+":"−")+fmt(Math.abs(o.money)).replace("−",""), o.money>0?"plus":"minus"]); }
  if(o.rep){ S.rep=Math.max(.55,Math.min(1.4,S.rep+o.rep)); L.push([o.rep>0?"⭐ Репутация выросла":"⭐ Репутация упала", o.rep>0?"plus":"minus"]); }
  if(o.traffic){ S.effects.push({type:"traffic",mult:o.traffic[0],until:S.day+o.traffic[1]}); L.push([`Прохожих ${o.traffic[0]>1?"+":"−"}${Math.round(Math.abs(o.traffic[0]-1)*100)}% на ${o.traffic[1]} дн.`, o.traffic[0]>1?"plus":"minus"]); }
  if(o.late){ S.lateOpen=o.late; L.push([`Завтра открытие в ${o.late}:00`,"minus"]); }
  if(o.fn) o.fn();
  return L; }

        ${L.wage?`<div class="ln"><span>Зарплаты</span><b class="minus">−${fmt(L.wage)}</b></div>`:""}
        <div class="ln"><span>Налог 6% и свет</span><b class="minus">−${fmt(L.tax+L.util)}</b></div>
        ${L.extra?`<div class="ln"><span>Прочее (${L.extraTxt.join(", ")})</span><b class="minus">−${fmt(L.extra)}</b></div>`:""}
        ${L.interest?`<div class="ln"><span>Долг вырос (проценты)</span><b class="minus">+${fmt(L.interest)}</b></div>`:""}
        ${L.bonus?`<div class="ln"><span>Награды за задания</span><b class="plus">+${fmt(L.bonus)}</b></div>`:""}
        ${L.critic?`<div class="ln"><span>🧐 ${L.critic}</span><b></b></div>`:""}
        ${(S.branches||[]).length?`<div class="ln"><span>🗺 Сеть (${S.branches.length} шт.), продано ${L.brSold||0}</span><b class="${(L.brNet||0)>=0?"plus":"minus"}">${(L.brNet||0)>=0?"+":""}${fmt(L.brNet||0)}</b></div>`:""}
        <div class="total"><span>Итог дня</span><span class="${L.net+(L.bonus||0)+(L.brNet||0)>=0?"plus":"minus"}">${L.net+(L.bonus||0)+(L.brNet||0)>=0?"+":""}${fmt(L.net+(L.bonus||0)+(L.brNet||0))}</span></div></div>`;
    }
  }
  if(!S.setup) h+=`<div class="card"><h3>ЗАДАНИЯ НА ДЕНЬ ${S.day+1}</h3>${tasksHTML()}</div>`+sponsorHTML();
  $("view").innerHTML=h; bindLinks();
  initCanvas(); hud();
  $("open").onclick=startDay;
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ S.speed=+b.dataset.s; save(); document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b)); });
  $("auto").onchange=e=>{ S.auto=e.target.checked; save(); };
  if($("pm")){ $("pm").onclick=()=>{ S.price=Math.max(120,S.price-10); save(); renderShop(); }; $("pp").onclick=()=>{ S.price=Math.min(600,S.price+10); save(); renderShop(); }; }
}
function renderUp(){
  let h=`<div class="card"><h3>УЛУЧШЕНИЯ ТОЧКИ</h3><p class="hint" style="margin-top:0">Покупаются один раз и работают до конца сезона.</p></div>`;
  UPG.forEach(u=>{ const own=S.up[u.id];
    h+=`<div class="card up"><div class="e">${u.e}</div><div class="tx"><b>${u.name}</b><span>${u.desc}</span></div>
      ${own?`<b class="plus">Есть ✓</b>`:`<button class="btn y" data-u="${u.id}" ${S.money<u.cost||S.setup?"disabled":""}>${fmt(u.cost)}</button>`}</div>`; });
  $("view").innerHTML=h;
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ const u=UPG.find(x=>x.id===b.dataset.u); if(running){toast("Дождись конца дня",true);return;} S.money-=u.cost; S.up[u.id]=true; addNews("Куплено: "+u.name); checkAch(); save(); render(); toast("Куплено: "+u.name); });
}
function genCands(){ S.cands=[0,1,2].map(i=>{ const sp=Math.round(rnd(18,46)), q=+rnd(.85,1.2).toFixed(2); return {id:Date.now()+i, name:pick(NAMES), speed:sp, q, wage:Math.round((1200+sp*55+(q-1)*5000)/100)*100}; }); save(); }
function renderTeam(){
  if(!S.cands||!S.cands.length) genCands();
  let h=`<div class="card"><h3>КОМАНДА</h3>
    <div class="stat"><div><small>Скорость кухни</small><b>${capacity()} шт/ч</b></div><div><small>Качество</small><b>${Math.round(quality()*100)}%</b></div></div>
    <p class="hint">Скорость ограничена грилем: ${G().cap+(S.up.grill2?45:0)} шт/ч. Зарплаты: ${fmt(wages())}/день.</p></div>`;
  S.staff.forEach(w=>{ h+=`<div class="card up"><div class="e">${w.owner?"😎":"🧑‍🍳"}</div><div class="tx"><b>${w.name}${w.owner?" (владелец)":""}</b><span>Скорость ${w.speed}/ч · качество ${Math.round(w.q*100)}% · ${w.wage?fmt(w.wage)+"/день":"без зарплаты"}</span></div>${w.owner?"":`<button class="btn r" data-f="${w.id}">Уволить</button>`}</div>`; });
  h+=`<div class="card"><h3>КАНДИДАТЫ</h3><p class="hint" style="margin-top:0">Новые кандидаты — каждую неделю. Максимум 4 человека в команде.</p></div>`;
  S.cands.forEach(c=>{ h+=`<div class="card up"><div class="e">🙋</div><div class="tx"><b>${c.name}</b><span>Скорость ${c.speed}/ч · качество ${Math.round(c.q*100)}% · ${fmt(c.wage)}/день</span></div><button class="btn g" data-h="${c.id}" ${S.staff.length>=4||S.setup?"disabled":""}>Нанять</button></div>`; });
  $("view").innerHTML=h;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ if(running){toast("Дождись конца дня",true);return;} const w=S.staff.find(x=>x.id==b.dataset.f); S.staff=S.staff.filter(x=>x!==w); S.money-=w.wage*3; addNews(`Уволен ${w.name} (выходное пособие ${fmt(w.wage*3)})`); save(); render(); toast(`${w.name} уволен. Выходное пособие ${fmt(w.wage*3)}`); });
  document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ if(running){toast("Дождись конца дня",true);return;} const c=S.cands.find(x=>x.id==b.dataset.h); S.staff.push({...c}); S.cands=S.cands.filter(x=>x!==c); addNews("Нанят "+c.name); checkAch(); save(); render(); toast("Нанят: "+c.name); });
}
function renderCash(){
  const last7=S.hist.slice(-7), rev=last7.reduce((a,x)=>a+x.rev,0), exp=last7.reduce((a,x)=>a+x.exp,0);
  let h=`<div class="card"><h3>СЧЁТ ПО ДНЯМ</h3><canvas id="ch" width="600" height="260" style="width:100%"></canvas></div>
    <div class="card"><h3>ПОСЛЕДНИЕ 7 ДНЕЙ</h3><div class="ln"><span>Выручка</span><b class="plus">+${fmt(rev)}</b></div><div class="ln"><span>Расходы</span><b class="minus">−${fmt(exp)}</b></div><div class="total"><span>Прибыль</span><span class="${rev-exp>=0?"plus":"minus"}">${fmt(rev-exp)}</span></div></div>`;
  if(S.debt>0) h+=`<div class="card"><h3>ДОЛГ ПО ЗАЙМУ</h3><div class="price"><div class="v minus">${fmt(S.debt)}</div></div><p class="hint">Растёт на 1,5% каждый день.</p>
      <div class="btns"><button class="btn" id="r50" ${S.money<50000?"disabled":""}>Вернуть 50 000</button><button class="btn y" id="rall" ${S.money<S.debt?"disabled":""}>Вернуть всё</button></div></div>`;
  h+=`<div class="card"><h3>ЕЖЕДНЕВНЫЕ РАСХОДЫ</h3><div class="ln"><span>Аренда</span><b>${fmt(rentOf(S.place)/30)}</b></div><div class="ln"><span>Зарплаты</span><b>${fmt(wages())}</b></div><div class="ln"><span>Свет и вода</span><b>${fmt(1500)}</b></div><div class="ln"><span>Налог</span><b>6% выручки</b></div></div>`;
  $("view").innerHTML=h; drawChart();
  if($("r50")){ $("r50").onclick=()=>{ const v=Math.min(50000,S.debt); S.money-=v; S.debt-=v; save(); render(); };
    $("rall").onclick=()=>{ S.money-=S.debt; S.debt=0; S.contracts=S.contracts.filter(c=>c.id!=="loan"); addNews("Займ погашен"); save(); render(); toast("Займ погашен!"); }; }
}
function drawChart(){
  const c=$("ch"); if(!c) return; const x=c.getContext("2d"), w=c.width, h=c.height, d=S.hist.slice(-30);
  x.fillStyle="#fff"; x.fillRect(0,0,w,h);
  if(d.length<2){ x.fillStyle="#8A7766"; x.font="600 22px sans-serif"; x.fillText("Сыграй пару дней — тут появится график",20,h/2); return; }
  const mn=Math.min(0,...d.map(p=>p.m)), mx=Math.max(...d.map(p=>p.m))*1.05||1;
  const X=i=>20+i*(w-40)/(d.length-1), Y=v=>h-24-(v-mn)/(mx-mn)*(h-48);
  if(mn<0){ x.strokeStyle="#D9483B"; x.setLineDash([6,6]); x.beginPath(); x.moveTo(0,Y(0)); x.lineTo(w,Y(0)); x.stroke(); x.setLineDash([]); }
  x.strokeStyle="#3E8E5E"; x.lineWidth=5; x.lineJoin="round"; x.beginPath(); d.forEach((p,i)=>i?x.lineTo(X(i),Y(p.m)):x.moveTo(X(i),Y(p.m))); x.stroke();
  x.fillStyle="#2A1C12"; x.font="700 20px sans-serif"; x.fillText(fmt(d[d.length-1].m),Math.min(w-170,X(d.length-1)-120),Math.max(22,Y(d[d.length-1].m)-12));
  x.fillStyle="#8A7766"; x.font="600 16px sans-serif"; x.fillText("день "+d[0].d,8,h-4); x.fillText("день "+d[d.length-1].d,w-80,h-4);
}
function renderMore(){
  let h=`<div class="card"><h3>ДОГОВОРЫ</h3>`;
  if(!S.contracts.length) h+=`<p class="hint">Пока ничего не подписано.</p>`;
  S.contracts.forEach((c,i)=>{ const isLease=c.id==="lease"; const title=isLease?`Аренда: ${PLACES[c.place].name}`:CONTRACTS[c.id].title;
    const canT = !isLease && CONTRACTS[c.id].term;
    h+=`<div class="ln" style="flex-wrap:wrap"><span>${isLease?"🏠":CONTRACTS[c.id].e} ${title}<br><small class="hint">подписан в день ${c.day}</small></span><span><button class="link" data-v="${i}">Открыть</button>${canT?` · <button class="link" data-t="${i}">Расторгнуть</button>`:""}</span><div id="cv${i}" style="width:100%"></div></div>`; });
  h+=`</div><div class="card"><h3>КАК ИГРАТЬ</h3><p>Открывай дни и смотри, сколько людей покупает. Если в итогах много «ушли из-за очереди» — нанимай людей или покупай второй гриль. Подбирай цену. Читай каждый договор. Три дня подряд в минусе — банкротство.</p></div>
    <div class="card"><h3>ИГРА</h3><div class="btns" style="flex-wrap:wrap"><button class="btn g" id="send">📤 Поделиться результатом</button><button class="btn y" id="inv2">👥 Пригласить друга</button><button class="btn r" id="reset">Начать заново</button></div></div>`;
  $("view").innerHTML=h;
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ const c=S.contracts[b.dataset.v]; const el=$("cv"+b.dataset.v);
    if(el.innerHTML){ el.innerHTML=""; return; }
    el.innerHTML = c.id==="lease"?contractBody(PLACES[c.place].contract.map(t=>t.replace(/\d[\d ]* ₽/,fmt(rentOf(c.place)))),[PLACES[c.place].trap]):contractBody(CONTRACTS[c.id].text,CONTRACTS[c.id].trap); });
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ if(running){toast("Дождись конца дня",true);return;} const c=S.contracts[b.dataset.t], C=CONTRACTS[c.id];
    modal(`<h2>Расторгнуть?</h2><p>${C.title}. ${C.trap.length?"Проверь штрафы в договоре.":""}</p><div class="btns"><button class="btn" id="n">Нет</button><button class="btn r" id="y">Расторгнуть</button></div>`);
    $("n").onclick=closeModal; $("y").onclick=()=>{ const f=C.term(); S.contracts.splice(+b.dataset.t,1); addNews(`Расторгнут: ${C.title}${f?" (штраф "+fmt(f)+")":""}`); save(); closeModal(); render(); toast(f?`Штраф ${fmt(f)}`:"Договор расторгнут", !!f); }; });
  $("send").onclick=shareResult; $("inv2").onclick=invite;
  $("reset").onclick=()=>{ modal(`<h2>Начать заново?</h2><p>Весь прогресс пропадёт.</p><div class="btns"><button class="btn" id="n">Нет</button><button class="btn r" id="y">Да, заново</button></div>`);
    $("n").onclick=closeModal; $("y").onclick=()=>{ running=false; S=fresh(); save(); closeModal(); tab="shop"; render(); intro(); }; };
}
$("nav").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0); };
$("btnRep").onclick=()=>{ modal(`<div class="ico">⭐</div><h2>Репутация ${stars()}</h2><p>Растёт от качества шаурмы и навеса со столиками. Падает, когда люди уходят из-за очереди, когда цена слишком высокая и после проверок. Чем выше репутация — тем больше покупателей.</p><div class="btns"><button class="btn y" id="ok">Ок</button></div>`,1); $("ok").onclick=closeModal; };
$("btnNews").onclick=()=>{ S.unread=0; save(); header(); modal(`<div class="ico">🔔</div><h2>События</h2>${S.news.length?S.news.map(n=>`<div class="ln"><span>${n.t}</span><b class="hint">д. ${n.d}</b></div>`).join(""):"<p>Пока тихо.</p>"}<div class="btns"><button class="btn y" id="ok">Закрыть</button></div>`,1); $("ok").onclick=closeModal; };
$("modal").onclick=e=>{ if(e.target.id==="modal" && $("sheet").dataset.c) closeModal(); };
window.addEventListener("resize",()=>{ if(tab==="shop") initCanvas(); });
if(!S.setup && !S.over && (!S.tasks||!S.tasks.length)) genTasks();
render();
if(S.setup) intro();
(function idle(){ if(!running && cx && tab==="shop"){ if(Math.random()<.01 && walkers.length<5) walkers.push(newWalker(false)); stepWalkers(1/30,1); draw(sim&&running?sim.min:(S.setup?600:420)); } setTimeout(idle,33); })();
</script>
</body>
</html>
