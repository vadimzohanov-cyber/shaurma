<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Шаурма с нуля</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#FFF1DC;--ink:#2A1C12;--card:#FFF9F0;--acc:#F07A2B;--acc2:#FFB23F;--grn:#3E8E5E;--red:#D9483B;--mut:#8A7766;--logo:#C8431F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:92px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
.top{display:flex;gap:10px;align-items:center}
.logo{flex:1;background:var(--logo);color:#FFF4E2;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 12px;text-align:center}
.logo b{display:block;font-size:24px;letter-spacing:5px;font-weight:900}
.logo small{display:block;font-size:10px;letter-spacing:3px;font-weight:800;opacity:.9}
.ibtn{width:52px;height:52px;border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--ink);font-size:22px;position:relative}
.ibtn .dot{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:20px;padding:1px 6px}
.row2{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px;gap:10px}
.pill{background:var(--ink);color:#FFF4E2;border-radius:30px;padding:9px 16px;font-weight:800;font-size:16px;white-space:nowrap}
.bal{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:6px 14px;text-align:right;min-width:170px}
.bal small{font-size:10px;letter-spacing:3px;font-weight:800;color:var(--mut)}
.bal b{display:block;font-size:24px;font-weight:900;white-space:nowrap}
.bal b.neg{color:var(--red)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:16px;margin:14px 0}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:3px;color:var(--mut);font-weight:900}
.card p{margin:6px 0;line-height:1.4}
.scene{position:relative;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);overflow:hidden;background:#cfe3ee}
.scene canvas{display:block;width:100%;height:auto}
.hud{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.hud span{border:2px solid var(--ink);border-radius:20px;padding:5px 12px;font-weight:900;font-size:15px;background:#fff}
.hud .t{background:var(--ink);color:#fff}.hud .m{background:var(--grn);color:#fff}
.weather{position:absolute;right:10px;top:10px;background:#fffd;border:2px solid var(--ink);border-radius:20px;padding:4px 10px;font-weight:800;font-size:14px}
.ctrl{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.big{flex:1;background:var(--acc2);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);font-size:21px;font-weight:900;padding:14px 8px}
.big:active,.btn:active,.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big:disabled{opacity:.55}
.seg{display:flex;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.seg button{border:0;background:var(--card);font-weight:900;font-size:17px;padding:0 13px;border-left:2px solid var(--ink)}
.seg button:first-child{border-left:0}.seg button.on{background:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin:14px 4px 0;font-weight:700;font-size:16px}
.chk input{width:24px;height:24px;accent-color:var(--acc)}
.goal{text-align:right;color:var(--mut);font-weight:600;margin:10px 2px 0;font-size:14px}
.ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px dashed #e3d3bf;font-size:16px}
.ln:last-child{border-bottom:0}.ln b{white-space:nowrap}
.plus{color:var(--grn)}.minus{color:var(--red)}
.total{border-top:3px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:900;font-size:18px;display:flex;justify-content:space-between}
.price{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price .v{font-size:34px;font-weight:900}
.btn{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:16px;padding:10px 14px}
.btn.y{background:var(--acc2)}.btn.g{background:var(--grn);color:#fff}.btn.r{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--ink);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;border-radius:16px;padding:6px 8px;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px}
nav button i{font-style:normal;font-size:24px}
nav button.on{background:var(--acc2)}
.modal{position:fixed;inset:0;background:#2a1c1299;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:10px}
.modal.hidden{display:none}
.sheet{background:var(--bg);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:22px 18px;margin-bottom:10px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .kick{text-align:center;letter-spacing:4px;font-size:13px;font-weight:900;color:var(--mut)}
.sheet h2{text-align:center;font-size:34px;margin:6px 0 4px;font-weight:900;line-height:1.05}
.sheet .sub{text-align:center;color:var(--mut);font-size:19px;font-weight:600;margin-bottom:14px}
.sheet p{font-size:17px;line-height:1.45}
.ico{font-size:70px;text-align:center;line-height:1.1}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;margin:12px 0}
.opt b{font-size:18px;display:block}.opt span{display:block;color:var(--mut);font-size:15px;margin-top:3px}
.opt em{display:block;font-style:normal;font-size:15px;margin-top:4px;font-weight:600}
.opt.on{background:var(--acc2)}.opt.on span{color:#5b4330}
.opt.off{opacity:.5}
.btns{display:flex;gap:12px;justify-content:center;margin-top:16px}
.btns .btn{font-size:19px;padding:12px 22px}
.inp{width:100%;font:inherit;font-size:22px;font-weight:800;padding:12px 16px;border:3px solid var(--ink);border-radius:16px;background:#fff;margin-top:6px}
.contract{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px;font-family:Georgia,serif;font-size:14px;line-height:1.45;margin-top:10px}
.contract .small{font-size:11px;color:#9a8f86}
.link{background:none;border:0;color:var(--logo);font-weight:800;text-decoration:underline;padding:0;font-size:15px;margin-top:6px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--grn);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 18px;font-weight:800;z-index:20;max-width:92%;box-shadow:0 4px 0 var(--ink);transition:opacity .3s}
.toast.bad{background:var(--red)}.toast.hidden{opacity:0;pointer-events:none}
.up{display:flex;gap:12px;align-items:center}
.up .e{font-size:36px}.up .tx{flex:1}.up .tx b{display:block;font-size:17px}.up .tx span{color:var(--mut);font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px}
.stat small{color:var(--mut);font-weight:700;font-size:12px}.stat b{display:block;font-size:20px}
.bar{height:12px;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grn)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><b id="logoName">ШАУРМА</b><small>С НУЛЯ · БЕТА</small></div>
    <button class="ibtn" id="btnRep" title="Репутация">⭐</button>
    <button class="ibtn" id="btnNews" title="События">🔔<span class="dot hidden" id="newsDot">1</span></button>
  </div>
  <div class="row2">
    <div class="pill" id="dayPill">День 0</div>
    <div class="bal"><small>НА СЧЕТУ</small><b id="money">0 ₽</b></div>
  </div>
  <div id="view"></div>
</div>
<nav id="nav">
  <button data-tab="shop" class="on"><i>🌯</i>Точка</button>
  <button data-tab="up"><i>🛠️</i>Улучшения</button>
  <button data-tab="team"><i>👥</i>Люди</button>
  <button data-tab="cash"><i>💰</i>Деньги</button>
  <button data-tab="more"><i>☰</i>Ещё</button>
</nav>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast hidden" id="toast"></div>

<script>
"use strict";
/* ===================== ДАННЫЕ ===================== */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try { tg && tg.ready(); tg && tg.expand(); } catch(e){}
const KEY = "shaurma_s_nulya_v1";
const DAYS = 180;
const MONTHS = ["сентябрь","октябрь","ноябрь","декабрь","январь","февраль","март"];
const WD = ["пн","вт","ср","чт","пт","сб","вс"];
const WDK = [1,.95,1,1.05,1.15,1.25,1.1];
const CURVE = [.5,1.4,1.0,.7,.8,1.25,1.8,1.5,.9,.8,1.0,1.5,1.7,1.2,.75]; // 7..21 ч
const CSUM = CURVE.reduce((a,b)=>a+b,0)/CURVE.length;

const DIFF = {
  easy:  {name:"Лёгкая", money:800000, traffic:1.2, fine:.7, desc:"800 тыс. на старте, покупателей больше"},
  normal:{name:"Нормальная", money:600000, traffic:1.0, fine:1, desc:"600 тыс. — честный старт"},
  hard:  {name:"Сложная", money:450000, traffic:.9, fine:1.4, desc:"450 тыс., конкуренты злее, штрафы выше"}
};
const PLACES = {
  market:{name:"Рынок «Северный»", rent:90000, traffic:3000, ref:230, emoji:"🧺",
    pitch:"Много людей по выходным, цены ниже.",
    contract:["1. Арендная плата — 90 000 ₽ в месяц.","2. Срок аренды — 12 месяцев.","3. Залог — одна месячная плата."],
    trap:"п. 7.3 Арендатор ежедневно оплачивает уборку прилегающей территории — 3 000 ₽ в день."},
  stop:{name:"Остановка у метро", rent:60000, traffic:3200, ref:240, emoji:"🚇",
    pitch:"Поток утром и вечером, аренда дешёвая.",
    contract:["1. Арендная плата — 60 000 ₽ в месяц.","2. Срок аренды — 12 месяцев.","3. Залог — одна месячная плата."],
    trap:"п. 9.1 Арендодатель вправе расторгнуть договор начиная с 45-го дня без компенсации, предупредив арендатора за 1 день."},
  mall:{name:"Фудкорт ТЦ «Галактика»", rent:150000, traffic:3800, ref:290, emoji:"🏬",
    pitch:"Самый большой поток и высокий чек.",
    contract:["1. Арендная плата — 150 000 ₽ в месяц.","2. Срок аренды — 12 месяцев.","3. Залог — одна месячная плата."],
    trap:"п. 4.2 Помимо арендной платы арендатор перечисляет ТЦ 8% от ежедневной выручки."}
};
const GRILLS = {
  new:{name:"Новый гриль из магазина", cost:420000, q:1.15, brk:.005, cap:60, desc:"Гарантия 2 года. Почти не ломается."},
  used:{name:"Б/у у закрывшейся точки", cost:200000, q:1.0, brk:.035, cap:50, desc:"«Год работал, как новый». Гарантии нет."},
  cheap:{name:"Дешёвый с Авито", cost:100000, q:.85, brk:.08, cap:40, desc:"Экономия сейчас. Мясо хуже, ломается часто."}
};
const UPG = [
  {id:"sign", e:"💡", name:"Яркая LED-вывеска", cost:70000, desc:"+10% прохожих замечают точку"},
  {id:"card", e:"💳", name:"Оплата картой и QR", cost:35000, desc:"+8% покупателей не уходят без налички"},
  {id:"grill2", e:"🔥", name:"Второй гриль", cost:160000, desc:"+45 шаурм в час к скорости кухни"},
  {id:"drinks", e:"🥤", name:"Напитки и комбо", cost:55000, desc:"Средний чек +15%"},
  {id:"tables", e:"⛱️", name:"Навес и столики", cost:90000, desc:"Репутация растёт, очередь длиннее на 4 человека"},
  {id:"delivery", e:"🛵", name:"Доставка через агрегатор", cost:120000, desc:"+20% заказов, но комиссия 25% с них"}
];
const NAMES = ["Ашот","Дима","Лёша","Марина","Тимур","Света","Рустам","Катя","Гоша","Айдар","Вика","Саня"];

/* ===================== СОСТОЯНИЕ ===================== */
let S = load();
let tab = "shop", running = false, sim = null;
const $ = id => document.getElementById(id);
const fmt = n => (n<0?"−":"") + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ") + " ₽";
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
function poisson(l){ if(l<=0) return 0; if(l>30) return Math.max(0,Math.round(l+Math.sqrt(l)*gauss())); let L=Math.exp(-l),k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

function fresh(){
  return {v:1, day:0, name:"Шаурма", diff:"normal", money:600000, place:null, grill:null,
    staff:[{id:0,name:"Ты",speed:16,q:1,wage:0,owner:true}], cands:[], price:240, rep:1,
    up:{}, contracts:[], debt:0, hist:[], last:null, negDays:0, competitor:false,
    effects:[], over:false, won:false, done:{}, supplier:false, franchise:false, insured:false,
    speed:1, auto:false, setup:true, news:[], weather:"sun", openFrom:7, totalSold:0};
}
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return s; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ===================== РАСЧЁТЫ ===================== */
const P = ()=>PLACES[S.place]||PLACES.stop;
const G = ()=>GRILLS[S.grill]||GRILLS.used;
function quality(){ let sp=0,q=0; S.staff.forEach(w=>{sp+=w.speed;q+=w.q*w.speed}); let v=(q/sp)*G().q; if(S.supplier) v-=.15; return v; }
function capacity(){ const staff=S.staff.reduce((a,w)=>a+w.speed,0); const grill=G().cap+(S.up.grill2?45:0); return Math.min(staff,grill); }
function wages(){ return S.staff.reduce((a,w)=>a+w.wage,0); }
function effMult(type){ return S.effects.filter(e=>e.type===type && e.until>=S.day).reduce((a,e)=>a*e.mult,1); }
function monthIdx(d){ return Math.min(MONTHS.length-1, Math.floor((d-1)/30)); }
function seasonK(d){ return [1,1,.92,.88,.86,.9,1][monthIdx(d)]; }
function priceK(){ const r=S.price/P().ref; let k=Math.exp(-2.1*(r-1)); if(S.competitor && S.price>230) k*=.88; return Math.max(.08,Math.min(2.2,k)); }
function avgCheck(){ return S.price*(S.up.drinks?1.15:1); }
function unitCost(){ return (S.supplier?75:110)+(S.up.drinks?10:0); }
function stars(){ return Math.max(1,Math.min(5,(S.rep*3.6))).toFixed(1); }
function dayTraffic(day){
  const wd=(day-1)%7, P0=P();
  let k = DIFF[S.diff].traffic * WDK[wd] * seasonK(day) * effMult("traffic");
  if(S.place==="market" && wd>=5) k*=1.15;
  if(S.up.sign) k*=1.1; if(S.franchise) k*=1.3; if(S.competitor) k*=.85;
  const w = {sun:1,cloud:.95,rain:.72,snow:.8}[S.weather]||1;
  return P0.traffic*k*w;
}
function buyP(){ let p=.06*priceK()*Math.max(.5,S.rep)*Math.max(.6,quality()); if(S.up.card)p*=1.08; return p; }
function rollWeather(day){ const m=monthIdx(day); const r=Math.random(); if(m>=3&&m<=5) return r<.25?"snow":r<.55?"cloud":"sun"; return r<.18?"rain":r<.45?"cloud":"sun"; }
const WEATHER = {sun:"☀️ ясно",cloud:"⛅ облачно",rain:"🌧 дождь",snow:"❄️ снег"};

/* ===================== СЦЕНА ===================== */
let cv, cx, W=0, H=0, walkers=[], floats=[], spinA=0;
const SKIN=["#F4D7C1","#E8BE9A","#C99470","#F1CFB3"], SHIRT=["#4F6D8F","#8E3B46","#5B7F5A","#C9A13B","#6B5B95","#3F7F8C","#B45F3A"], HAIR=["#1E1A18","#5A3A22","#A0662C","#2B2B2B","#7A2E2E"];
function sceneHTML(){ return `<div class="scene"><canvas id="cv"></canvas><div class="weather" id="wth"></div><div class="hud"><span class="t" id="hTime">07:00</span><span id="hSold">0 шт.</span><span class="m" id="hRev">+0 ₽</span></div></div>`; }
function initCanvas(){
  cv=$("cv"); if(!cv) return; cx=cv.getContext("2d");
  const r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  W=480; H=360; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  if(!walkers.length) for(let i=0;i<3;i++) walkers.push(newWalker(false, rnd(0,W)));
  draw(sim?sim.min:420);
}
function newWalker(buyer,x){
  const dir = Math.random()<.5?1:-1;
  return {x: x!==undefined?x:(dir>0?-30:W+30), y: 300+rnd(-6,10), dir, sp:rnd(28,46), buyer, st: buyer?"in":"walk", slot:-1,
    skin:pick(SKIN), shirt:pick(SHIRT), hair:pick(HAIR), long:Math.random()<.4, ph:rnd(0,6), carry:false, s:rnd(.8,.9)};
}
function skyCol(min){
  const h=min/60; const st=[[6,"#9EC3DD","#F6D7B0"],[9,"#A8D2EC","#DDEFF6"],[16,"#9CCBE8","#E5F1F3"],[19,"#F2A86B","#F7D79A"],[21,"#5B4B7A","#E59A6A"],[23,"#1E2440","#3A3460"]];
  for(let i=0;i<st.length-1;i++){ if(h<st[i+1][0]){ const t=Math.max(0,(h-st[i][0])/(st[i+1][0]-st[i][0])); return [mix(st[i][1],st[i+1][1],t),mix(st[i][2],st[i+1][2],t)]; } }
  return [st[st.length-1][1],st[st.length-1][2]];
}
function mix(a,b,t){ const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16); const c=[16,8,0].map(s=>Math.round(((pa>>s)&255)*(1-t)+((pb>>s)&255)*t)); return "rgb("+c.join(",")+")"; }
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function draw(min){
  if(!cx) return;
  const [s1,s2]=skyCol(min); let g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,s1); g.addColorStop(.7,s2); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  const night = min>=20*60;
  // дома
  const B=[[10,120,60],[75,90,55],[135,140,70],[215,100,60],[285,130,55],[345,85,65],[415,125,60]];
  B.forEach(([x,y,w],i)=>{ cx.fillStyle=night?"#3a3552":"#8FA3B5"; cx.fillRect(x,y,w,240-y); cx.fillStyle=night?"#F7D57A":"#BFD0DD";
    for(let wy=y+10;wy<225;wy+=18) for(let wx=x+8;wx<x+w-8;wx+=14){ if(!night || ((wx*7+wy*3+i)%5)<3) cx.fillRect(wx,wy,7,9);} });
  // тротуар
  cx.fillStyle="#C9BBA6"; cx.fillRect(0,240,W,H-240); cx.fillStyle="#B5A690"; for(let x=0;x<W;x+=40) cx.fillRect(x,240,2,H-240);
  cx.fillStyle="#9C8E7A"; cx.fillRect(0,238,W,4);
  // фонарь

function drawWalker(w){

  cx.fillStyle=w.skin==="#F4D7C1"?"#fff":w.skin; cx.beginPath(); cx.arc(0,-86,17,0,7); cx.fill(); cx.stroke();

  cx.fillStyle=ink; const fx = w.st==="queue"?-3:w.dir*3; cx.beginPath(); cx.arc(fx-5,-86,2.2,0,7); cx.arc(fx+5,-86,2.2,0,7); cx.fill();
  cx.beginPath(); cx.arc(fx,-82,5,.3,Math.PI-.3); cx.lineWidth=2; cx.stroke(); cx.lineWidth=3;
  if(w.carry){ cx.fillStyle="#F3E2C2"; rr(w.dir*12-6,-60,12,24,5); cx.fill(); cx.stroke(); cx.fillStyle="#C8431F"; cx.fillRect(w.dir*12-6,-46,12,6); }

const QX = i => 192 + i*34;
let lastOut=0, spawnAcc=0;
function stepWalkers(dt, gameRate){
  spinA += dt*1.5; lastOut += dt;
  spawnAcc += dt*(running?0.55:0.25);
  if(spawnAcc>1){ spawnAcc=0; if(walkers.filter(w=>w.st==="walk").length<6) walkers.push(newWalker(false)); }
  if(sim && sim.queue) sim.queue.forEach((q,i)=>{ const tx=QX(i); if(q.x===undefined) q.x=tx+70; q.x += (tx-q.x)*Math.min(1,dt*6); q.ph+=dt*8; });
  walkers.forEach(w=>{
    const v = w.sp*dt*Math.min(3,Math.max(1,gameRate));
    if(w.st==="walk"){ w.x+=w.dir*v; w.ph+=dt*8; }
    else if(w.st==="in"){ const tx=QX(w.slot); const d=tx-w.x; if(Math.abs(d)<3){ w.st="queue"; w.x=tx; w.y=296; } else { w.dir=Math.sign(d); w.x+=w.dir*Math.min(Math.abs(d),v*1.3); w.ph+=dt*8; w.y+= (296-w.y)*.1; } }
    else if(w.st==="queue"){ const tx=QX(w.slot); if(Math.abs(tx-w.x)>2){ w.x+=Math.sign(tx-w.x)*Math.min(Math.abs(tx-w.x),v); w.ph+=dt*8; } }
    else if(w.st==="out"){ w.x+=w.dir*v*1.1; w.ph+=dt*8; w.y+=(306-w.y)*.05; }
  });
  walkers = walkers.filter(w=>w.x>-60 && w.x<W+60);
  floats.forEach(f=>{f.y-=dt*30; f.a-=dt*.9}); floats=floats.filter(f=>f.a>0);
}

/* ===================== СИМУЛЯЦИЯ ДНЯ ===================== */
function startDay(){
  if(running || S.over) return;
  if(S.setup){ intro(); return; }
  S.day++;
  S.weather = rollWeather(S.day);
  const traffic = dayTraffic(S.day);
  sim = {min:420, end:1320, traffic, p:buyP(), cap:capacity(), maxQ:8+(S.up.tables?4:0), queue:[], prog:0,
         sold:0, lost:0, rev:0, ing:0, acc:0};
  S.openFrom = S.grillBroken ? 14 : 7;
  running = true; walkers = walkers.filter(w=>w.st==="walk"); floats=[];
  renderShop(); lastT = performance.now(); requestAnimationFrame(loop);
}
let lastT=0;
function loop(t){
  if(!running) return;
  const dt = Math.min(.1,(t-lastT)/1000); lastT=t;
  const rate = 30*S.speed; // игровых минут в секунду
  sim.acc += dt*rate;
  while(sim.acc>=1 && sim.min<sim.end){ sim.acc-=1; simMinute(); }
  stepWalkers(dt, S.speed);
  draw(sim.min); hud();
  if(sim.min>=sim.end && sim.queue.length===0){ endDay(); return; }
  if(sim.min>=sim.end){ // дообслуживаем очередь после закрытия
    sim.prog += sim.cap/60; while(sim.prog>=1 && sim.queue.length){ sim.prog-=1; serve(); }
  }
  requestAnimationFrame(loop);
}
function simMinute(){
  const h = Math.floor(sim.min/60), open = h>=S.openFrom;
  const c = CURVE[Math.min(14,Math.max(0,h-7))]/CSUM;
  const lam = sim.traffic/900*c;
  if(open){
    const buyers = poisson(lam*sim.p);
    for(let i=0;i<buyers;i++){
      if(sim.queue.length < sim.maxQ){ const w=newWalker(true); w.st="queue"; w.y=296; w.x=undefined; sim.queue.push(w); }
      else sim.lost++;
    }
    sim.prog += sim.cap/60;
    while(sim.prog>=1 && sim.queue.length){ sim.prog-=1; serve(); }
    if(!sim.queue.length) sim.prog=Math.min(sim.prog,1);
  }
  sim.min++;
}
function serve(){
  const w = sim.queue.shift();
  if(w && lastOut>0.3){ lastOut=0; w.st="out"; w.carry=true; w.dir=1; if(w.x===undefined) w.x=QX(0); walkers.push(w); if(floats.length<4) floats.push({t:"+"+Math.round(avgCheck()),x:w.x-10,y:w.y-100,a:1.2}); }
  sim.sold++; sim.rev += avgCheck(); sim.ing += unitCost();
}
function hud(){
  const m=Math.min(sim?sim.min:420,1320); const hh=String(Math.floor(m/60)).padStart(2,"0"), mm=String(m%60).padStart(2,"0");
  if($("hTime")) $("hTime").textContent = hh+":"+mm;
  if($("hSold")) $("hSold").textContent = (sim?sim.sold:0)+" шт.";
  if($("hRev")) $("hRev").textContent = "+"+fmt(sim?sim.rev:0).replace(" ₽","")+" ₽";
  if($("wth")) $("wth").textContent = WEATHER[S.weather]||"";
}
function endDay(){
  running=false;
  const P0=P(), r={day:S.day, sold:sim.sold, lost:sim.lost, rev:sim.rev, ing:sim.ing};
  let deliv=0;
  if(S.up.delivery){ const n=Math.round(sim.sold*.2*rnd(.8,1.2)); deliv=n*avgCheck()*.75; r.sold+=n; r.ing+=n*unitCost(); r.deliv=n; }
  r.rev += deliv;
  r.rent = P0.rent/30;
  r.wage = wages();
  r.util = 1500;
  r.tax = r.rev*.06;
  r.extra = 0; r.extraTxt=[];
  if(S.place==="market"){ r.extra+=3000; r.extraTxt.push("уборка"); }
  if(S.place==="mall"){ r.extra+=r.rev*.08; r.extraTxt.push("8% ТЦ"); }
  if(S.franchise){ r.extra+=r.rev*.12; r.extraTxt.push("роялти 12%"); }
  if(S.insured){ r.extra+=900; r.extraTxt.push("страховка"); }
  if(S.grillBroken){ r.extra+=S.repairCost||0; r.extraTxt.push("ремонт"); S.grillBroken=false; S.repairCost=0; }
  r.interest = 0;
  if(S.debt>0){ r.interest = S.debt*.015; S.debt += r.interest; }
  r.exp = r.ing + r.rent + r.wage + r.util + r.tax + r.extra;
  r.net = r.rev - r.exp;
  S.money += r.net; S.totalSold += r.sold;
  // репутация
  const q=quality(), lostShare = sim.lost/Math.max(1,sim.sold+sim.lost);
  let dr = .03*(q-1) - .08*lostShare + (S.up.tables?.006:0);
  if(S.price>P0.ref*1.3) dr-=.01; if(S.price<P0.ref*.85) dr+=.004;
  S.rep = Math.max(.55,Math.min(1.4,S.rep+dr));
  S.hist.push({d:S.day,m:Math.round(S.money),rev:Math.round(r.rev),exp:Math.round(r.exp),sold:r.sold});
  if(S.hist.length>200) S.hist.shift();
  S.last = r;
  S.effects = S.effects.filter(e=>e.until>S.day);
  if(S.day%7===0) S.cands=[];
  if(S.money<0){ S.negDays++; } else S.negDays=0;
  save(); render();
  if(S.negDays>=3){ bankrupt(); return; }
  if(S.money<0) toast("Касса в минусе! Ещё "+(3-S.negDays)+" дн. — и банкротство",true);
  if(S.day>=DAYS){ victory(); return; }
  const evs = buildEvents(S.day+1);
  if(evs.length){ runEvents(evs, ()=>afterEvents()); } else afterEvents();
}

    else { txt="Всё чисто! Инспекторы даже купили по шаурме. Репутация выросла."; S.rep=Math.min(1.4,S.rep+.04); }
    S.money-=fine; addNews(fine?`Проверка: штраф ${fmt(fine)}`:"Проверка пройдена");
    modal(`<div class="ico">🕵️</div><h2>Санитарная проверка</h2><p>${txt}</p>${fine?`<p><b class="minus">Штраф: ${fmt(fine)}</b></p>`:""}<div class="btns"><button class="btn y" id="ok">Дальше</button></div>`);
    $("ok").onclick=next;
  } else if(ev.kind==="evict"){
    modal(`<div class="ico">📦</div><h2>Тебя выселяют!</h2><p>Арендодатель воспользовался пунктом 9.1 договора: с завтрашнего дня точка у метро закрыта. Переезд обойдётся в 120 000 ₽. Куда?</p>
      <button class="opt" id="m1"><b>${PLACES.market.emoji} ${PLACES.market.name}</b><span>Аренда ${fmt(PLACES.market.rent)}/мес</span></button>
      <button class="opt" id="m2"><b>${PLACES.mall.emoji} ${PLACES.mall.name}</b><span>Аренда ${fmt(PLACES.mall.rent)}/мес</span></button>`);
    const mv=p=>{ S.place=p; S.money-=120000+PLACES[p].rent; S.contracts=S.contracts.filter(c=>c.id!=="lease"); S.contracts.push({id:"lease",place:p,day:S.day}); addNews("Переезд: "+PLACES[p].name); next(); };
    $("m1").onclick=()=>mv("market"); $("m2").onclick=()=>mv("mall");
  }
}
function contractBody(lines, trap){
  return `<div class="contract">${lines.map(l=>`<div>${l}</div>`).join("")}${trap.length?`<div style="margin-top:10px">${trap.map(t=>`<div class="small">${t}</div>`).join("")}</div>`:""}<div style="margin-top:12px;font-size:12px">Подпись: ____________</div></div>`;
}
function showContract(id, next){
  const c=CONTRACTS[id];
  modal(`<div class="kick">${c.kick}</div><div class="ico">${c.e}</div><h2>${c.title}</h2><p>${c.pitch}</p>
    <button class="link" id="rd">📄 Читать договор</button><div id="ct"></div>
    <div class="btns"><button class="btn" id="no">Отказаться</button><button class="btn y" id="yes">Подписать</button></div>`);
  $("rd").onclick=()=>{ $("ct").innerHTML=contractBody(c.text,c.trap); $("rd").remove(); };
  $("no").onclick=()=>{ addNews("Отказался: "+c.title); next(); };
  $("yes").onclick=()=>{ c.sign(); S.contracts.push({id, day:S.day+1}); addNews("Подписан договор: "+c.title); toast("Договор подписан: "+c.title); next(); };
}

/* ===================== СТАРТ ИГРЫ (МАСТЕР) ===================== */
let draft={};
function intro(){
  draft={diff:"normal",name:"Шаурма",place:null,grill:null,hire:null,read:{}};
  const nm = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? ", "+tg.initDataUnsafe.user.first_name : "";
  modal(`<div class="kick">ДЕНЬ 0</div><div class="ico">🌯</div><h2>Шаурма с нуля</h2><div class="sub">Бизнес-симулятор</div>
    <p>Привет${nm}! Ты три года копил деньги на заводе. Сегодня ты уволился и открываешь свою шаурмичную. Каждое решение стоит денег: место, гриль, люди, цена.</p>
    <p><b>Главное правило: читай договоры до конца.</b> В мелком шрифте может быть пункт, который заберёт всё.</p>
    <p>Цель сезона — продержаться <b>${DAYS} дней</b> и не обанкротиться.</p>
    <div class="btns"><button class="btn y" id="go">Начать</button></div>`);

}
function step1(){
  modal(`<div class="kick">ШАГ 1 ИЗ 4</div><h2>Сложность</h2>
    ${Object.entries(DIFF).map(([k,d])=>`<button class="opt ${draft.diff===k?"on":""}" data-d="${k}"><b>${d.name}</b><span>${d.desc}</span></button>`).join("")}

    <input class="inp" id="nm" maxlength="14" value="${draft.name}">
    <div class="btns"><button class="btn y" id="nx">К выбору места</button></div>`);
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ draft.diff=b.dataset.d; draft.name=$("nm").value; step1(); });
  $("nx").onclick=()=>{ draft.name=($("nm").value||"Шаурма").trim().slice(0,14); step2(); };
}
function startMoney(){ return DIFF[draft.diff].money; }
function step2(){
  modal(`<div class="kick">ШАГ 2 ИЗ 4</div><div class="ico">📍</div><h2>Место</h2><div class="sub">Залог — одна месячная аренда</div>
    ${Object.entries(PLACES).map(([k,p])=>`<div class="opt ${draft.place===k?"on":""}" data-p="${k}"><b>${p.emoji} ${p.name}</b><span>${p.pitch} Аренда ${fmt(p.rent)}/мес.</span>
      <button class="link" data-r="${k}">📄 ${draft.read[k]?"Скрыть договор":"Читать договор"}</button>${draft.read[k]?contractBody(p.contract,[p.trap]):""}</div>`).join("")}
    <div class="btns"><button class="btn" id="bk">Назад</button><button class="btn y" id="nx" ${draft.place?"":"disabled"}>Дальше</button></div>`);
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=e=>{ if(e.target.dataset.r) return; draft.place=b.dataset.p; step2(); });
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=b.dataset.r; draft.read[k]=!draft.read[k]; step2(); });
  $("bk").onclick=step1; $("nx").onclick=step3;
}
function step3(){
  const left = startMoney()-PLACES[draft.place].rent;
  modal(`<div class="kick">ШАГ 3 ИЗ 4</div><div class="ico">🔥</div><h2>Гриль</h2><div class="sub">Самая дорогая покупка</div>
    ${Object.entries(GRILLS).map(([k,g])=>{ const rest=left-g.cost; const ok=rest>=100000;
      return `<button class="opt ${draft.grill===k?"on":""} ${ok?"":"off"}" data-g="${k}" ${ok?"":"disabled"}><b>${g.name} — ${fmt(g.cost)}</b><span>${g.desc}</span><em class="${ok?"plus":"minus"}">${ok?"После покупки останется "+fmt(rest):"Не хватит денег на запуск (нужно 100 000 ₽ в запасе)"}</em></button>`; }).join("")}
    <div class="btns"><button class="btn" id="bk">Назад</button><button class="btn y" id="nx" ${draft.grill?"":"disabled"}>Дальше</button></div>`);
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ draft.grill=b.dataset.g; step3(); });
  $("bk").onclick=step2; $("nx").onclick=step4;
}
function step4(){
  const c=[{name:"Ашот",speed:40,q:1.12,wage:3800,d:"Опытный шаурмист. Быстрый и вкусный, но дорогой."},{name:"Дима",speed:24,q:.95,wage:1800,d:"Студент. Дешёвый, учится на ходу."}];
  modal(`<div class="kick">ШАГ 4 ИЗ 4</div><div class="ico">👥</div><h2>Команда</h2><div class="sub">Ты сам делаешь ~16 шаурм в час</div>
    <button class="opt ${draft.hire===null?"on":""}" data-h="-1"><b>Работаю один</b><span>Без зарплат, но в час пик будет очередь</span></button>
    ${c.map((w,i)=>`<button class="opt ${draft.hire===i?"on":""}" data-h="${i}"><b>${w.name} — ${fmt(w.wage)}/день</b><span>${w.d} Скорость ${w.speed}/ч.</span></button>`).join("")}
    <div class="btns"><button class="btn" id="bk">Назад</button><button class="btn y" id="nx">Открыть точку!</button></div>`);
  document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ const v=+b.dataset.h; draft.hire=v<0?null:v; step4(); });
  $("bk").onclick=step3;
  $("nx").onclick=()=>{
    const keepAuto=S.auto, keepSpeed=S.speed;
    S=fresh(); S.speed=keepSpeed; S.auto=false;
    S.diff=draft.diff; S.name=draft.name; S.place=draft.place; S.grill=draft.grill;
    S.money = startMoney() - PLACES[draft.place].rent - GRILLS[draft.grill].cost;
    S.price = PLACES[draft.place].ref;
    if(draft.hire!==null){ const w=c[draft.hire]; S.staff.push({id:1,name:w.name,speed:w.speed,q:w.q,wage:w.wage}); }
    S.contracts.push({id:"lease",place:draft.place,day:1});
    S.setup=false; addNews("Открыта точка «"+S.name+"»");
    save(); closeModal(); render(); toast("Точка готова! Жми «Открыть день 1»");
  };
}

function renderCash(){

function drawChart(){
  const c=$("ch"); if(!c) return; const x=c.getContext("2d"), w=c.width, h=c.height, d=S.hist.slice(-30);
  x.fillStyle="#fff"; x.fillRect(0,0,w,h);
  if(d.length<2){ x.fillStyle="#8A7766"; x.font="600 22px sans-serif"; x.fillText("Сыграй пару дней — тут появится график",20,h/2); return; }
  const mn=Math.min(0,...d.map(p=>p.m)), mx=Math.max(...d.map(p=>p.m))*1.05||1;
  const X=i=>20+i*(w-40)/(d.length-1), Y=v=>h-24-(v-mn)/(mx-mn)*(h-48);
  if(mn<0){ x.strokeStyle="#D9483B"; x.setLineDash([6,6]); x.beginPath(); x.moveTo(0,Y(0)); x.lineTo(w,Y(0)); x.stroke(); x.setLineDash([]); }
  x.strokeStyle="#3E8E5E"; x.lineWidth=5; x.lineJoin="round"; x.beginPath(); d.forEach((p,i)=>i?x.lineTo(X(i),Y(p.m)):x.moveTo(X(i),Y(p.m))); x.stroke();
  x.fillStyle="#2A1C12"; x.font="700 20px sans-serif"; x.fillText(fmt(d[d.length-1].m),Math.min(w-170,X(d.length-1)-120),Math.max(22,Y(d[d.length-1].m)-12));
  x.fillStyle="#8A7766"; x.font="600 16px sans-serif"; x.fillText("день "+d[0].d,8,h-4); x.fillText("день "+d[d.length-1].d,w-80,h-4);
}
function renderMore(){
  let h=`<div class="card"><h3>ДОГОВОРЫ</h3>`;
  if(!S.contracts.length) h+=`<p class="hint">Пока ничего не подписано.</p>`;
  S.contracts.forEach((c,i)=>{ const isLease=c.id==="lease"; const title=isLease?`Аренда: ${PLACES[c.place].name}`:CONTRACTS[c.id].title;
    const canT = !isLease && CONTRACTS[c.id].term;
    h+=`<div class="ln" style="flex-wrap:wrap"><span>${isLease?"🏠":CONTRACTS[c.id].e} ${title}<br><small class="hint">подписан в день ${c.day}</small></span><span><button class="link" data-v="${i}">Открыть</button>${canT?` · <button class="link" data-t="${i}">Расторгнуть</button>`:""}</span><div id="cv${i}" style="width:100%"></div></div>`; });
  h+=`</div><div class="card"><h3>КАК ИГРАТЬ</h3><p>Открывай дни и смотри, сколько людей покупает. Если в итогах много «ушли из-за очереди» — нанимай людей или покупай второй гриль. Подбирай цену. Читай каждый договор. Три дня подряд в минусе — банкротство.</p></div>
    <div class="card"><h3>ИГРА</h3><div class="btns" style="flex-wrap:wrap"><button class="btn g" id="send">🏆 Отправить результат в топ</button><button class="btn r" id="reset">Начать заново</button></div></div>`;
  $("view").innerHTML=h;
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ const c=S.contracts[b.dataset.v]; const el=$("cv"+b.dataset.v);
    if(el.innerHTML){ el.innerHTML=""; return; }
    el.innerHTML = c.id==="lease"?contractBody(PLACES[c.place].contract,[PLACES[c.place].trap]):contractBody(CONTRACTS[c.id].text,CONTRACTS[c.id].trap); });
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ if(running){toast("Дождись конца дня",true);return;} const c=S.contracts[b.dataset.t], C=CONTRACTS[c.id];
    modal(`<h2>Расторгнуть?</h2><p>${C.title}. ${C.trap.length?"Проверь штрафы в договоре.":""}</p><div class="btns"><button class="btn" id="n">Нет</button><button class="btn r" id="y">Расторгнуть</button></div>`);
    $("n").onclick=closeModal; $("y").onclick=()=>{ const f=C.term(); S.contracts.splice(+b.dataset.t,1); addNews(`Расторгнут: ${C.title}${f?" (штраф "+fmt(f)+")":""}`); save(); closeModal(); render(); toast(f?`Штраф ${fmt(f)}`:"Договор расторгнут", !!f); }; });
  $("send").onclick=sendScore;
  $("reset").onclick=()=>{ modal(`<h2>Начать заново?</h2><p>Весь прогресс пропадёт.</p><div class="btns"><button class="btn" id="n">Нет</button><button class="btn r" id="y">Да, заново</button></div>`);
    $("n").onclick=closeModal; $("y").onclick=()=>{ running=false; S=fresh(); save(); closeModal(); tab="shop"; render(); intro(); }; };
}
$("nav").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0); };
$("btnRep").onclick=()=>{ modal(`<div class="ico">⭐</div><h2>Репутация ${stars()}</h2><p>Растёт от качества шаурмы и навеса со столиками. Падает, когда люди уходят из-за очереди, когда цена слишком высокая и после проверок. Чем выше репутация — тем больше покупателей.</p><div class="btns"><button class="btn y" id="ok">Ок</button></div>`,1); $("ok").onclick=closeModal; };
$("btnNews").onclick=()=>{ S.unread=0; save(); header(); modal(`<div class="ico">🔔</div><h2>События</h2>${S.news.length?S.news.map(n=>`<div class="ln"><span>${n.t}</span><b class="hint">д. ${n.d}</b></div>`).join(""):"<p>Пока тихо.</p>"}<div class="btns"><button class="btn y" id="ok">Закрыть</button></div>`,1); $("ok").onclick=closeModal; };
$("modal").onclick=e=>{ if(e.target.id==="modal" && $("sheet").dataset.c) closeModal(); };
window.addEventListener("resize",()=>{ if(tab==="shop") initCanvas(); });
render();
if(S.setup) intro();
(function idle(){ if(!running && cx && tab==="shop"){ if(Math.random()<.01 && walkers.length<5) walkers.push(newWalker(false)); stepWalkers(1/30,1); draw(sim&&running?sim.min:(S.setup?600:420)); } setTimeout(idle,33); })();
</script>
</body>
